# Onya API as a Baseten custom server (Truss).
# Baseten builds from the public python:3.12-slim image and bundles the
# staged Truss directory at /app: config.yaml, requirements.txt, src/,
# data/. No container registry is needed.
model_name: onya-api
description: Covenant monitoring API for the Onya site.
base_image:
  image: python:3.12-slim
build_commands:
  - pip install --no-cache-dir -r /app/requirements.txt
resources:
  cpu: "1"
  memory: 2Gi
environment_variables:
  META_BASE_URL: https://api.meta.ai/v1
  SEC_USER_AGENT: "OnyaDemo/1.0 (public SEC filings demo)"
  ONYA_ENV: production
  ONYA_FRONTEND_ORIGIN: https://placeholder.invalid
secrets:
  - META_API_KEY
  - ONYA_DEMO_TOKEN
docker_server:
  start_command: sh -c "cd /app && uvicorn api:app --app-dir src --host 0.0.0.0 --port 8000 --workers 1"
  server_port: 8000
  predict_endpoint: /health
  readiness_endpoint: /health
  liveness_endpoint: /health
