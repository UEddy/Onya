name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: onya-ci ci@example.invalid
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Python tests (offline data, no model calls)
        run: python -m unittest $(ls tests/test_*.py | sed 's#/#.#; s#\.py$##')
      - name: Recompute the back-test totals
        run: make eval PYTHON=python

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: JS tests
        run: npm run test:what-if
      - name: Lint and copy checks
        run: npm run lint
      - name: Type checks
        run: |
          npx next typegen
          npx tsc --noEmit
